services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intelix
      POSTGRES_USER: intelix
      POSTGRES_PASSWORD: intelix
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data","./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes: ["./backend:/app"]
    command: mvn spring-boot:run
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/intelix
      DB_USER: intelix
      DB_PASSWORD: intelix
    ports: ["8080:8080"]
    depends_on: [postgres]
  ml:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./ml:/app"]
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
